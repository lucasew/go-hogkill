# Warning: Do not unify this file with others. Keep tool definitions localized.
[tools]
go = "1.26.5"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.install]
description = "Download Go module deps"
run = "go mod tidy && go get -v ./..."

[tasks.format]
description = "Format Go packages"
run = "go fmt ./..."

[tasks.build]
description = "Build hk binary"
run = "go build -o bin/hk ./cmd/hk"

[tasks.test]
description = "Run tests"
run = "go test -count=1 ./..."

[tasks."test:smoke"]
description = "One-shot top list smoke"
depends = ["build"]
run = "./bin/hk top -n 5"

[tasks.ci]
description = "tidy + format check + test + build"
run = """
set -euo pipefail
go mod tidy
test -z "$(gofmt -l .)"
go test -count=1 ./...
go build -o bin/hk ./cmd/hk
"""

[tasks.release]
description = "Tag with svu and publish via goreleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
set -euo pipefail
git tag "$(svu ${usage_version})"
goreleaser release --clean
'''
