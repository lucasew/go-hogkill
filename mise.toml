# Warning: Do not unify this file with others. Keep tool definitions localized.
[tools]
go = "1.26.5"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks."install:tidy"]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

[tasks."install:download"]
description = "Download module dependencies"
run = "go mod download"

[tasks.install]
description = "Tidy and download Go modules"
depends = ["install:*"]

[tasks."fmt:go"]
description = "Format Go packages"
run = "go fmt ./..."

[tasks.fmt]
description = "Format all"
depends = ["fmt:*"]

[tasks."lint:vet"]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Lint all"
depends = ["lint:*"]

[tasks."test:go"]
description = "Run Go tests"
run = "go test -count=1 ./..."

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks."build:hk"]
description = "Build hk binary into bin/hk"
run = "go build -o bin/hk ./cmd/hk"

[tasks.build]
description = "Build all binaries"
depends = ["build:*"]

[tasks.smoke]
description = "One-shot top list smoke"
depends = ["build"]
run = "./bin/hk top -n 5"

[tasks.ci]
description = "install, fmt, lint, test, build"
depends = ["install", "fmt", "lint", "test", "build"]

[tasks.release]
description = "Tag with svu and publish with goreleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = [
  "git tag $(svu ${usage_version})",
  "goreleaser release --clean",
]
