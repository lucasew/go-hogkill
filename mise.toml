# Warning: Do not unify this file with others. Keep tool definitions localized.
[tools]
go = "1.26.5"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.install]
description = "Download Go module deps"
run = "go mod tidy && go get -v ./..."

[tasks.build]
description = "Build hk binary"
run = "go build -o bin/hk ./cmd/hk"

[tasks.test]
description = "Run tests"
run = "go test -count=1 ./..."

[tasks."test:smoke"]
description = "One-shot top list smoke"
depends = ["build"]
run = "./bin/hk top -n 5"

[tasks.ci]
description = "tidy + test + build"
run = "go mod tidy && go test -count=1 ./... && go build -o bin/hk ./cmd/hk"

[tasks.release]
description = "Tag next version with svu and run goreleaser"
run = """
set -euo pipefail
next="$(svu next)"
git tag "$next"
goreleaser release --clean
"""
